<section class="wrap abschnitt">
  <p class="eyebrow">{{eyebrow}}</p>
  <h1>Packliste</h1>
  <div class="pack-kopf" style="margin-top:20px">
    <div>
      <p>{{einleitung}}</p>
      <p style="font-size:13.5px; color:var(--ink-faint)">Die Häkchen sind zum Abpacken gedacht und bleiben nur in diesem Browser gespeichert.</p>
      <nav class="pack-sprungliste" aria-label="Gruppen">{{sprungliste}}</nav>
    </div>
    <div class="pack-summe">
      <p class="eyebrow">Gesamtgewicht</p>
      <p class="gesamt">{{gesamt}}<small> {{gesamt_einheit}}</small></p>
      <p class="gesamt-note">{{gesamt_note}}</p>
      <div class="pack-verteilung">{{verteilung}}</div>
      <div class="pack-verteilung-legende">{{verteilung_legende}}</div>
    </div>
  </div>

  <div class="pack-werkzeuge">
    <span class="pack-fortschritt-text" id="packFortschritt"></span>
    <button class="knopf-klein" id="packReset" type="button">Häkchen zurücksetzen</button>
  </div>
  <div class="fortschritt" style="max-width:420px"><i id="packFortschrittBalken" style="width:0"></i></div>

  <div id="packliste" style="margin-top:30px">{{gruppen}}</div>
</section>
