<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxi&rsquo;s Bikepacking Adventure on the Route des Grandes Alpes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --paper:#f8f8f6; --paper-deep:#eceff5; --paper-line:#d2d9e5;
    --ink:#101828; --ink-soft:#465370; --ink-faint:#7c879e;
    --forest:#0f3c91; --forest-strong:#0a2c6e; --contour:#d3202f;
    --on-forest:#ffffff;
    --ramp-0:#0f3c91; --ramp-1:#5a8ccd; --ramp-2:#eceef5; --ramp-3:#e05a5f; --ramp-4:#a8121f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0c1424; --paper-deep:#131d31; --paper-line:#26334c;
      --ink:#e9eef7; --ink-soft:#a6b3ca; --ink-faint:#75819b;
      --forest:#6f9be8; --forest-strong:#9dbdf5; --contour:#f4757f; --on-forest:#0a1220;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0c1424; --paper-deep:#131d31; --paper-line:#26334c;
    --ink:#e9eef7; --ink-soft:#a6b3ca; --ink-faint:#75819b;
    --forest:#6f9be8; --forest-strong:#9dbdf5; --contour:#f4757f; --on-forest:#0a1220;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--paper); color:var(--ink); font-family:'Archivo','Helvetica Neue',Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2{ font-family:'Fraunces',Georgia,'Times New Roman',serif; font-weight:600; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--forest); outline-offset:2px; }

  .app{ display:grid; grid-template-columns:minmax(272px,318px) 1fr; height:100dvh; min-height:100dvh; }

  .sidebar{ background:var(--paper-deep); border-right:1px solid var(--paper-line); display:flex; flex-direction:column; min-height:0; overflow-y:auto; }
  .trip-header{ padding:26px 22px 18px; border-bottom:1px solid var(--paper-line); }
  .eyebrow{ margin:0 0 6px; font-size:11px; letter-spacing:0.11em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; }
  .trip-header h1{ font-size:26px; line-height:1.08; }
  .trip-route{ margin:8px 0 0; font-size:13px; color:var(--ink-soft); }
  .trip-stats{ display:flex; gap:18px; margin:14px 0 0; padding:0; }
  .trip-stats div{ display:flex; flex-direction:column; gap:2px; }
  .trip-stats dt{ font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; }
  .trip-stats dd{ margin:0; font-size:16px; font-weight:600; }

  .day-list{ display:flex; flex-direction:column; padding:10px; gap:8px; flex:1 1 auto; }
  .day-card{ text-align:left; background:transparent; border:1px solid transparent; border-radius:10px; padding:12px 12px 11px; cursor:pointer; display:flex; flex-direction:column; gap:8px; transition:background-color .15s ease; }
  .day-card:hover{ background:color-mix(in srgb, var(--forest) 8%, transparent); }
  .day-card[aria-current="true"]{ background:var(--forest); border-color:var(--forest); }
  .day-index{ font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; color:var(--ink-faint); }
  .day-card[aria-current="true"] .day-index{ color:var(--on-forest); opacity:0.75; }
  .day-name{ font-family:'Fraunces',Georgia,serif; font-size:16px; font-weight:600; line-height:1.2; }
  .day-card[aria-current="true"] .day-name{ color:var(--on-forest); }
  .day-gap-note{ font-size:10.5px; color:var(--contour); font-style:italic; margin:2px 0 -2px; }
  .day-card[aria-current="true"] .day-gap-note{ color:var(--on-forest); opacity:0.8; }
  .sparkline{ width:100%; height:32px; display:block; }
  .sparkline path{ fill:none; stroke:var(--forest); stroke-width:1.6; }
  .day-card[aria-current="true"] .sparkline path{ stroke:var(--on-forest); opacity:0.85; }
  .day-card-stats{ display:flex; gap:14px; font-size:12.5px; }
  .day-card-stats .stat{ color:var(--ink-soft); }
  .day-card[aria-current="true"] .day-card-stats .stat{ color:var(--on-forest); opacity:0.85; }
  .day-card-stats .stat b{ font-weight:600; color:var(--ink); }
  .day-card[aria-current="true"] .day-card-stats .stat b{ color:var(--on-forest); }

  .sidebar-footer{ padding:14px 22px 20px; border-top:1px solid var(--paper-line); font-size:11.5px; line-height:1.5; color:var(--ink-faint); }
  .sidebar-footer a{ color:var(--forest-strong); }

  .map-panel{ display:grid; grid-template-rows:auto auto 1fr auto; min-width:0; min-height:0; background:var(--paper); }
  .map-topbar{ display:flex; align-items:center; gap:20px; padding:14px 22px; border-bottom:1px solid var(--paper-line); flex-wrap:wrap; }
  .map-title{ display:flex; flex-direction:column; gap:2px; min-width:170px; }
  .map-day-index{ font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase; font-weight:700; color:var(--forest); }
  .map-title h2{ font-size:20px; }
  .map-stats{ display:flex; gap:20px; margin-left:auto; flex-wrap:wrap; }
  .map-stats div{ display:flex; flex-direction:column; gap:1px; }
  .map-stats dt{ font-size:10px; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; }
  .map-stats dd{ margin:0; font-size:14px; font-weight:600; }
  .stat-gain{ color:var(--forest-strong); }
  .stat-loss{ color:var(--contour); }
  .layer-toggle{ display:flex; gap:4px; background:var(--paper-deep); padding:3px; border-radius:9px; border:1px solid var(--paper-line); }
  .layer-toggle button{ border:none; background:transparent; font-size:11.5px; padding:5px 10px; border-radius:6px; cursor:pointer; color:var(--ink-soft); }
  .layer-toggle button.active{ background:var(--forest); color:var(--on-forest); font-weight:600; }

  #map{ width:100%; height:100%; background:var(--paper); }
  .leaflet-container{ font-family:'Archivo',sans-serif; background:var(--paper); }

  .profile-panel{ position:relative; height:140px; border-top:1px solid var(--paper-line); background:var(--paper-deep); }
  #profileSvg{ width:100%; height:100%; display:block; }
  .profile-tooltip{ position:absolute; top:8px; background:var(--ink); color:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:4px 8px; border-radius:6px; transform:translateX(-50%); pointer-events:none; opacity:0; transition:opacity .1s ease; white-space:nowrap; }
  .profile-tooltip.show{ opacity:1; }

  .rr-popup{ font-family:'Archivo',sans-serif; font-size:13px; }

  .day-date{ font-size:11px; color:var(--ink-faint); font-weight:500; letter-spacing:0.02em; }
  .day-card[aria-current="true"] .day-date{ color:var(--on-forest); opacity:0.75; }
  .day-card.is-today .day-date{ color:var(--contour); font-weight:700; }
  .day-cols{ font-size:11.5px; color:var(--contour); line-height:1.35; }
  .day-card[aria-current="true"] .day-cols{ color:var(--on-forest); opacity:0.85; }
  .day-card.is-todo .day-name,
  .day-card.is-todo .day-card-stats .stat b{ color:var(--ink-soft); }
  .day-card.is-todo .sparkline path{ stroke:var(--ink-faint); stroke-dasharray:3 2; }
  .day-card.is-today{ border-color:var(--contour); }
  .day-card[aria-current="true"].is-today{ border-color:var(--forest); }

  .trip-progress{ margin-top:12px; height:5px; border-radius:3px; background:var(--paper-line); overflow:hidden; }
  .trip-progress i{ display:block; height:100%; background:var(--forest); }
  .trip-progress-note{ margin:6px 0 0; font-size:11px; color:var(--ink-faint); }

  .strava{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
    text-decoration:none; color:#fff; background:#fc4c02; padding:4px 9px; border-radius:6px; }
  .strava:hover{ background:#e04402; }
  .strava.muted{ background:transparent; color:var(--ink-faint); font-weight:500;
    border:1px solid var(--paper-line); cursor:default; }
  .day-bar{ display:flex; align-items:center; gap:26px; flex-wrap:wrap;
    padding:10px 22px; border-bottom:1px solid var(--paper-line); background:var(--paper-deep); }
  .day-bar:empty{ display:none; }
  .day-bar-group{ display:flex; align-items:center; gap:9px; min-width:0; }
  .day-bar-label{ font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    font-weight:700; color:var(--ink-faint); white-space:nowrap; }
  .day-bar-items{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .day-bar-group.on-strava{ margin-left:auto; }
  .day-bar-empty{ font-size:12px; color:var(--ink-faint); font-style:italic; }

  .pass-chip{ display:inline-flex; align-items:baseline; gap:5px; font-size:11.5px; text-decoration:none;
    color:var(--contour); border:1px solid var(--paper-line); border-radius:6px; padding:3px 8px; background:var(--paper); }
  .pass-chip:hover{ border-color:var(--contour); background:var(--paper-deep); }
  .pass-chip.manual{ border-style:dashed; }
  .pass-chip.nolink{ border-style:dotted; color:var(--ink-faint); }
  .pass-chip.manual .ele::after{ content:" *"; }
  .pass-chip b{ font-weight:600; color:var(--ink); }
  .pass-chip .ele{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; }

  .pass-panel{ border-top:1px solid var(--paper-line); padding:14px 18px 4px; }
  .pass-panel h3{ margin:0 0 2px; font-family:'Fraunces',Georgia,serif; font-size:15px; font-weight:600; }
  .pass-panel .pass-sub{ margin:0 0 10px; font-size:11px; color:var(--ink-faint); }
  .pass-panel .pass-sub a{ color:var(--forest-strong); }
  .pass-day{ margin-bottom:10px; }
  .pass-day .pass-day-label{ font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:600; display:block; margin-bottom:4px; }
  .pass-day .pass-links{ display:flex; flex-wrap:wrap; gap:5px; }

  @media (max-width:760px){
    .app{ grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    .sidebar{ border-right:none; border-bottom:1px solid var(--paper-line); }
    .trip-header{ padding:16px 16px 12px; }
    .trip-header h1{ font-size:21px; }
    .day-list{ flex-direction:row; overflow-x:auto; padding:10px 12px; gap:10px; }
    .day-card{ min-width:180px; flex:0 0 auto; }
    .sidebar-footer{ display:none; }
    .map-stats dt{ display:none; }
    .day-bar{ padding:10px 16px; gap:10px; }
    .day-bar-group{ align-items:flex-start; }
    .day-bar-group.on-strava{ margin-left:0; }
    .layer-toggle{ order:10; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>

    </div>

    <div class="day-bar" id="dayBar"></div>

    <div id="map"></div>

    <div class="profile-panel">
      <svg id="profileSvg" viewBox="0 0 1000 220" preserveAspectRatio="none"></svg>
      <div class="profile-tooltip mono" id="profileTip"></div>
    </div>
  </main>
</div>

/* ---------- hypsometric ramp (shared with the offline artifact) ---------- */
const RAMP = [
  [0.00, [15,60,145]], [0.32, [90,140,205]], [0.55, [236,238,245]],
  [0.78, [224,90,95]], [1.00, [168,18,31]],
];
function rampColor(t){
  t = Math.max(0, Math.min(1, t));
  for(let i=0;i<RAMP.length-1;i++){
    const [t0,c0] = RAMP[i], [t1,c1] = RAMP[i+1];
    if(t>=t0 && t<=t1){
      const f = (t-t0)/(t1-t0);
      const r = Math.round(c0[0]+(c1[0]-c0[0])*f);
      const g = Math.round(c0[1]+(c1[1]-c0[1])*f);
      const b = Math.round(c0[2]+(c1[2]-c0[2])*f);
      return `rgb(${r},${g},${b})`;
    }
  }
  return `rgb(${RAMP[RAMP.length-1][1].join(",")})`;
}

function renderRoute(route){
  currentRoute = route;
  routeLayerGroup.clearLayers();

  const latlngs = route.points.map(p => [p.lat, p.lon]);
  let minE = Infinity, maxE = -Infinity;
  for(const p of route.points){ if(p.ele<minE) minE=p.ele; if(p.ele>maxE) maxE=p.ele; }

  const st = statusOf(route);
  L.polyline(latlngs, {color:'#ffffff', weight:8, opacity:0.85, lineCap:'round', lineJoin:'round'}).addTo(routeLayerGroup);
  L.polyline(latlngs, {
    color: st==='todo' ? '#0f3c91' : '#d3202f',
    weight:4.5, opacity:1, lineCap:'round', lineJoin:'round',
    dashArray: st==='todo' ? '9 7' : null
  }).addTo(routeLayerGroup);

  const start = route.points[0], end = route.points[route.points.length-1];
  const [fromName, toName] = route.displayName.split(' → ');
  L.circleMarker([start.lat,start.lon], {radius:8, color:'#0f3c91', weight:3, fillColor:'#ffffff', fillOpacity:1})
    .bindTooltip(`Start · ${fromName}`, {direction:'top'}).addTo(routeLayerGroup);
  L.circleMarker([end.lat,end.lon], {radius:8, color:'#d3202f', weight:3, fillColor:'#ffffff', fillOpacity:1})
    .bindTooltip(`Finish · ${toName}`, {direction:'top'}).addTo(routeLayerGroup);

  for(const w of route.waypoints){
    L.circleMarker([w.lat,w.lon], {radius:5.5, color:'#ffffff', weight:2, fillColor:'#101828', fillOpacity:1})
      .bindPopup(`<div class="rr-popup">${w.name}</div>`).addTo(routeLayerGroup);
  }

  cursorMarker = L.circleMarker([start.lat,start.lon], {radius:6, color:'#ffffff', weight:2, fillColor:'#101828', opacity:0, fillOpacity:0})
    .addTo(routeLayerGroup);

  const bounds = L.latLngBounds(latlngs);
  map.fitBounds(bounds, {padding:[28,28]});

  const status = statusOf(route);
  document.getElementById('mapDayIndex').textContent =
    "Day " + dayNo(route) + " of 14 · " + fmtDate(route.date) +
    (status==='today' ? ' · today' : '');
  const passes = passesOf(route);
  document.getElementById('dayBar').innerHTML = `
    <div class="day-bar-group">
      <span class="day-bar-label">${passes.length === 1 ? 'Pass' : 'Passes'}</span>
      <div class="day-bar-items">${
        passes.length ? passChips(passes)
                      : `<span class="day-bar-empty">${status==='todo' ? 'Planned: ' + (route.cols.join(', ') || 'no cols') : 'None recorded'}</span>`
      }</div>
    </div>
    <div class="day-bar-group on-strava">
      <span class="day-bar-label">On Strava</span>
      <div class="day-bar-items">${stravaHTML(route)}</div>
    </div>`;
  document.getElementById('mapRouteName').textContent = route.displayName;
  document.getElementById('statDist').textContent = fmtKm(route.distanceKm);
  document.getElementById('statGain').textContent = "+" + Math.round(route.elevGainM).toLocaleString('en-US') + " m";
  document.getElementById('statLoss').textContent = "−" + Math.round(route.elevLossM).toLocaleString('en-US') + " m";
  document.getElementById('statRange').textContent = Math.round(route.minEle) + "–" + Math.round(route.maxEle) + " m";

/* ---------- elevation profile (same design as the offline artifact) ---------- */
const NSSVG = "http://www.w3.org/2000/svg";
function el(tag, attrs){ const n = document.createElementNS(NSSVG, tag); if(attrs) for(const k in attrs) n.setAttribute(k, attrs[k]); return n; }
const profileSvg = document.getElementById('profileSvg');
const profileTip = document.getElementById('profileTip');

function renderProfile(route, minE, maxE){
  profileSvg.innerHTML = "";
  const W=1000, H=220, padL=6, padR=6, padT=16, padB=28;
  const maxD = route.points[route.points.length-1].d;
  const eRange = Math.max(1, maxE-minE);
  const eloPad = eRange*0.12;
  const yMin = minE-eloPad, yMax = maxE+eloPad;
  function X(d){ return padL + (d/maxD)*(W-padL-padR); }
  function Y(e){ return H-padB - ((e-yMin)/(yMax-yMin))*(H-padT-padB); }

  const defs = el('defs');
  const grad = el('linearGradient', {id:'profGrad', x1:'0', y1:'0', x2:'0', y2:'1'});
  [[1.0,0],[0.78,0.22],[0.55,0.45],[0.30,0.7],[0.0,1.0]].forEach(([rt,off])=>{
    grad.appendChild(el('stop', {offset:(off*100)+'%', 'stop-color':rampColor(rt)}));
  });
  defs.appendChild(grad); profileSvg.appendChild(defs);

  for(let g=0; g<=3; g++){
    const y = Y(yMin + (yMax-yMin)*g/3);
    profileSvg.appendChild(el('line', {x1:padL,y1:y,x2:W-padR,y2:y, stroke:'var(--paper-line)', 'stroke-width':1}));
  }

  let d = `M ${X(0)} ${Y(route.points[0].ele)}`;
  for(const p of route.points) d += ` L ${X(p.d)} ${Y(p.ele)}`;
  const areaD = d + ` L ${X(maxD)} ${H-padB} L ${X(0)} ${H-padB} Z`;
  profileSvg.appendChild(el('path', {d:areaD, fill:'url(#profGrad)', opacity:'0.55'}));
  profileSvg.appendChild(el('path', {d, fill:'none', stroke:'var(--forest-strong)', 'stroke-width':2}));

  const hoverG = el('g', {opacity:'0'});
  const hoverLine = el('line', {y1:padT, y2:H-padB, stroke:'var(--ink)', 'stroke-width':1, 'stroke-dasharray':'3,3'});
  const hoverDot = el('circle', {r:4.5, fill:'var(--ink)', stroke:'var(--paper)', 'stroke-width':2});
  hoverG.appendChild(hoverLine); hoverG.appendChild(hoverDot);
  profileSvg.appendChild(hoverG);

  const hitRect = el('rect', {x:padL, y:0, width:W-padL-padR, height:H, fill:'transparent'});
  profileSvg.appendChild(hitRect);

  function onMove(clientX){
    const rect = profileSvg.getBoundingClientRect();
    const fx = (clientX-rect.left)/rect.width;
    const dist = fx*maxD;
    let nearest = route.points[0], nd = Infinity;
    for(const p of route.points){ const diff = Math.abs(p.d-dist); if(diff<nd){ nd=diff; nearest=p; } }
    const x = X(nearest.d), y = Y(nearest.ele);
    hoverLine.setAttribute('x1',x); hoverLine.setAttribute('x2',x);
    hoverDot.setAttribute('cx',x); hoverDot.setAttribute('cy',y);
    hoverG.setAttribute('opacity','1');
    profileTip.textContent = nearest.d.toFixed(1) + " km · " + Math.round(nearest.ele) + " m";
    profileTip.style.left = ((x/W)*rect.width) + 'px';
    profileTip.classList.add('show');
    if(cursorMarker){
      cursorMarker.setLatLng([nearest.lat, nearest.lon]);
      cursorMarker.setStyle({opacity:1, fillOpacity:1});
    }
  }
  hitRect.addEventListener('pointermove', (e)=>onMove(e.clientX));
  hitRect.addEventListener('pointerleave', ()=>{
    hoverG.setAttribute('opacity','0');
    profileTip.classList.remove('show');
    if(cursorMarker) cursorMarker.setStyle({opacity:0, fillOpacity:0});
  });
}

/* ---------- sidebar ---------- */
function buildSparkline(route){
  const pts = route.points;
  const stride = Math.max(1, Math.floor(pts.length/40));
  const sampled = [];
  for(let i=0;i<pts.length;i+=stride) sampled.push(pts[i]);
  const eles = sampled.map(p=>p.ele);
  const min = Math.min(...eles), max = Math.max(...eles);
  const range = Math.max(1, max-min);
  const W=260,H=32,pad=3;
  let d = "";
  sampled.forEach((p,i)=>{
    const x = pad + (i/(sampled.length-1))*(W-pad*2);
    const y = H-pad - ((p.ele-min)/range)*(H-pad*2);
    d += (i===0?"M":"L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
  });
  return `<svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}"/></svg>`;
}

function selectDay(id){
  document.querySelectorAll('.day-card').forEach(c=>{
    c.setAttribute('aria-current', c.getAttribute('data-id')===id ? 'true' : 'false');
  });
  renderRoute(ROUTES.find(r=>r.id===id));
}

document.getElementById('dayList').addEventListener('keydown', (e)=>{
  if(e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
  const cards = [...document.querySelectorAll('.day-card')];
  const idx = cards.indexOf(document.activeElement);
  if(idx===-1) return;
  e.preventDefault();
  cards[e.key==='ArrowDown' ? Math.min(cards.length-1, idx+1) : Math.max(0, idx-1)].focus();
});

function init(){
  buildSidebar();
  buildPassPanel();
  const totalDist = ROUTES.reduce((s,r)=>s+r.distanceKm,0);
  const totalGain = ROUTES.reduce((s,r)=>s+r.elevGainM,0);
  document.getElementById('tripDist').textContent = totalDist.toFixed(0) + " km";
  document.getElementById('tripGain').textContent = "+" + Math.round(totalGain).toLocaleString('en-US') + " m";

  const ridden = ROUTES.filter(r=>statusOf(r)!=='todo');
  const doneDist = ridden.reduce((s,r)=>s+r.distanceKm,0);
  document.getElementById('tripDone').textContent = doneDist.toFixed(0) + " km";
  document.getElementById('tripProgress').style.width = (doneDist/totalDist*100).toFixed(1) + "%";
  const left = ROUTES.length - ridden.length;
  document.getElementById('tripProgressNote').textContent =
    left ? `Day ${ridden.length} of ${ROUTES.length} · ${left} to go` : 'Isolabona reached';

  const opening = ROUTES.find(r=>statusOf(r)==='today') || ROUTES.find(r=>statusOf(r)==='todo') || ROUTES[ROUTES.length-1];
  selectDay(opening.id);
}
init();
</script>
</body>
</html>
